services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: seat_reserve
      POSTGRES_USER: seatreserve
      POSTGRES_PASSWORD: seatreserve
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatreserve -d seat_reserve"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/seat_reserve
      DB_USERNAME: seatreserve
      DB_PASSWORD: seatreserve
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
